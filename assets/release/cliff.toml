# DNF — shared git-cliff configuration
#
# One config for the whole ecosystem: framework (Nix), dnf-generator (Rust),
# dnf-doc (Astro). Renders ONE Keep a Changelog version block; the surrounding
# file (header, `## [Unreleased]`, reference-link footer) is owned by
# `assets/scripts/just-bump.sh`, which preserves the hand-written history of
# dnf-doc.
#
# Consumed with an explicit relative path, never auto-discovered:
#   dnf/           just bump  ->  assets/release/cliff.toml
#   doc/           just bump  ->  ../dnf/assets/release/cliff.toml
#   src/generator/ just bump  ->  ../../dnf/assets/release/cliff.toml

[changelog]

# Empty: `just-bump.sh` writes the file header once, at creation.
header = ""

# `striptags` drops the `<!-- n -->` sort keys carried by group names.
body = """
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
{% if not commits %}
_No user-visible change._
{% endif %}
"""

# Reference links live at the end of the file, maintained by `just-bump.sh`.
footer = ""

trim = true

# SemVer 0.x contract of the framework: a rupture moves MINOR, everything else
# moves PATCH. Both defaults would move MAJOR/MINOR one step too far.
[bump]
breaking_always_bump_major = false
features_always_bump_minor = false

# Before the first tag `--bump` would propose an unprefixed `0.1.0`, which its
# own `tag_pattern` then rejects.
initial_tag = "v0.1.0"

[git]

conventional_commits = true

# Legacy subjects (`matrix(...)`, `luks(...)`, scope used as type) carry no
# usable type: dropping them beats inventing a group for them.
filter_unconventional = true
split_commits = false

# Vocabulary drift, normalised before parsing so history predating the frozen
# type list still renders.
commit_preprocessors = [
  { pattern = '^update(\(|:)', replace = "chore${1}" },
  { pattern = '^doc(\(|:)', replace = "docs${1}" },
  { pattern = '^refact(\(|:)', replace = "refactor${1}" },
  { pattern = '^improv(\(|:)', replace = "refactor${1}" },
  { pattern = '^clean(\(|:)', replace = "chore${1}" },
]

# First match wins. `<!-- n -->` prefixes order the sections; `striptags`
# removes them at render time.
commit_parsers = [
  # `breaking` covers both forms — the `!` marker and a BREAKING CHANGE footer.
  { field = "breaking", pattern = "true", group = "<!-- 0 -->⚠ Breaking" },

  # A removal is a removal whatever the type that carried it.
  { message = '^(feat|fix|refactor)(\(.+\))?: *(drop|remove)', group = "<!-- 4 -->Removed" },

  { message = "^feat", group = "<!-- 1 -->Added" },
  { message = "^fix", group = "<!-- 2 -->Fixed" },
  { message = "^security", group = "<!-- 3 -->Security" },
  { message = "^perf", group = "<!-- 5 -->Changed" },
  { message = "^refactor", group = "<!-- 5 -->Changed" },
  { message = "^revert", group = "<!-- 5 -->Changed" },
  { message = "^docs", group = "<!-- 6 -->Documentation" },

  { message = "^chore", skip = true },
  { message = "^ci", skip = true },
  { message = "^test", skip = true },
  { message = "^build", skip = true },
  { message = "^style", skip = true },
]

protect_breaking_commits = true
filter_commits = true

# Release tags only: `bk-dnf-preword` and friends must not read as versions.
tag_pattern = "v[0-9]*"

topo_order = false
sort_commits = "oldest"
