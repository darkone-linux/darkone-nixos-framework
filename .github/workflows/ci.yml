name: CI

# No `paths:` filter on purpose. The former one restricted CI to `lib/**` and
# `tests/unit/**`, so a PR touching only `modules/`, `home/`, `hosts/` or
# `flake.nix` ran no workflow at all and merged green.
#
# `workflow_call`: release.yml replays the exact same gates on a tag, instead of
# duplicating them and letting the two drift.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# Same Nix as the developer machines: the action's default drifts on its own
# release cycle, and eval memory or behaviour differs between Nix versions.
env:
  NIX_VERSION: 2.34.8

jobs:
  # Conventional commits are what `git-cliff` turns into the CHANGELOG. A single
  # off-vocabulary type is silently dropped from the release notes, so the
  # vocabulary is a gate, not a convention.
  commits:
    name: Commit messages

    # `main` pushes too: commits land there directly, rarely through a PR.
    # Skipped when release.yml replays CI on a tag: nothing new to check.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Same gate as the local `commit-msg` hook: scripts/check-commit-msg.sh.
      - name: Validate messages
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then

            # PR head, not the synthetic `refs/pull/N/merge` checkout.
            range="$PR_BASE..$PR_HEAD"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$AFTER"
          else

            # Force push or first push: `before` is absent from the clone.
            # Fall back to the last release tag, else the pushed commit alone.
            tag=$(git describe --tags --abbrev=0 --match 'v*' "$AFTER" 2>/dev/null || true)
            if [ -n "$tag" ]; then range="$tag..$AFTER"; else range="$AFTER^!"; fi
          fi
          scripts/check-commit-msg.sh --commits "$range"

  unit-tests:
    name: Unit tests (nix-unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          install_url: https://releases.nixos.org/nix/nix-${{ env.NIX_VERSION }}/install
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Run unit tests
        run: nix run nixpkgs#nix-unit -- --flake .#libTests

  # One runner per system, one nix process per output: `nix flake check` keeps
  # every output live, its peak grows with each scenario (11.2 GB per system,
  # 2026-09) and the 16 GB runner OOM-kills it at random: SIGTERM, exit 143, no
  # output. Per output, the peak is the heaviest single one (~3.1 GB).
  eval:
    name: Evaluate flake outputs (${{ matrix.system }})
    runs-on: ubuntu-latest
    strategy:

      # A failure on one architecture must not hide the other one's result.
      fail-fast: false
      matrix:
        system:
          - x86_64-linux
          - aarch64-linux
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          install_url: https://releases.nixos.org/nix/nix-${{ env.NIX_VERSION }}/install
          nix_path: nixpkgs=channel:nixos-unstable

      # Pure evaluation gate: it catches the `attribute missing` / type errors
      # that only surfaced at deploy time, without booting the VM scenarios
      # (those run in `just simulate`).
      - name: Evaluate outputs (one nix process each)
        run: scripts/eval-flake-outputs.sh ${{ matrix.system }}

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          install_url: https://releases.nixos.org/nix/nix-${{ env.NIX_VERSION }}/install
          nix_path: nixpkgs=channel:nixos-unstable

      # Same three tools `just clean` runs locally, so CI and the developer
      # workflow cannot drift. Not `nix develop`: the devShell ends on
      # `exec zsh`, which would swallow the command.
      - name: statix
        run: nix run nixpkgs#statix -- check .

      - name: deadnix
        run: nix run nixpkgs#deadnix -- --fail .

      - name: treefmt (no diff expected)
        run: |
          nix shell nixpkgs#treefmt nixpkgs#nixfmt --command \
            treefmt --config-file assets/treefmt.toml --no-cache --fail-on-change

      # Nested `just` calls resolve at runtime only: parse every bootstrap and
      # check each call names a recipe of its own context.
      - name: just recipes
        run: nix shell nixpkgs#just nixpkgs#jq --command bash just/scripts/check-recipes.sh
