name: CI

# No `paths:` filter on purpose. The former one restricted CI to `lib/**` and
# `tests/unit/**`, so a PR touching only `modules/`, `home/`, `hosts/` or
# `flake.nix` ran no workflow at all and merged green.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    name: Unit tests (nix-unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Run unit tests
        run: nix run nixpkgs#nix-unit -- --flake .#libTests

  eval:
    name: Evaluate flake outputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # `--no-build` keeps this a pure evaluation gate: it catches the
      # `attribute missing` / type errors that only surfaced at deploy time,
      # without booting the VM scenarios (those live in simulations.yml).
      # The sed filter mirrors `just check-flake`: DNF's non-standard outputs
      # are expected, any *other* unknown output stays visible.
      - name: nix flake check (eval only)
        run: |
          set -euo pipefail
          nix flake check --no-build --all-systems 2>&1 \
            | sed -E "/^warning: unknown flake output '(colmena|colmenaHive|homeManagerModules|libTests|mkNodes)'$/d"

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # Same three tools `just clean` runs locally, so CI and the developer
      # workflow cannot drift. Not `nix develop`: the devShell ends on
      # `exec zsh`, which would swallow the command.
      - name: statix
        run: nix run nixpkgs#statix -- check .

      - name: deadnix
        run: nix run nixpkgs#deadnix -- --fail .

      - name: treefmt (no diff expected)
        run: |
          nix shell nixpkgs#treefmt nixpkgs#nixfmt --command \
            treefmt --config-file assets/treefmt.toml --no-cache --fail-on-change
