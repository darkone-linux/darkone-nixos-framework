name: Installer test

# `darkone new` end to end in a VM, real network (tests/installer), about
# 25 min a scenario. Gates the ISO of a release (release.yml); a weekly run on
# `main` catches a nixpkgs unstable breakage before the next tag.
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

# Same Nix as ci.yml and the developer machines.
env:
  NIX_VERSION: 2.34.8

# Runner image pinned (`ubuntu-latest` moves to 26.04 from 2026-10-19): every
# workflow moves at once, after this one passes on the new image.

jobs:
  scenario:
    name: Installer test (${{ matrix.scenario }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        scenario: [scripted, interactive]
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: cachix/install-nix-action@v31
        with:
          install_url: https://releases.nixos.org/nix/nix-${{ env.NIX_VERSION }}/install
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The VM disk grows to about 20 GB: on the runner's temporary disk.
      - name: Run
        run: |
          set -euo pipefail
          sudo mkdir -p /mnt/dnf-test && sudo chown "$USER" /mnt/dnf-test
          out=$(nix build --no-link --print-out-paths .#nixosConfigurations.iso-x86_64-linux.config.system.build.isoImage)
          nix run .#installer-test -- --iso "$(ls "$out"/iso/*.iso)" \
            --scenario ${{ matrix.scenario }} --workdir /mnt/dnf-test

      - name: Serial log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installer-test-${{ matrix.scenario }}
          path: /mnt/dnf-test/*/serial.log
          if-no-files-found: ignore
