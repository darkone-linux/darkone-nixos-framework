# node variant: a gateway, a hypervisor and an AI space microVM guest.
# Exercises `darkone.system.microvm` (guest and hypervisor sides), the
# `ai-space` host profile and isolated sops. Evaluated only (eval-all): no
# nested VM boot.

network:
  domain: "test.local"
  default:
    locale: "en_US.UTF-8"
    timezone: "Etc/UTC"
  coordination:
    enable: false
    hostname: "hcs"
    domain: "headscale"
  smtp:
    protocol: "submissions"
    server: "smtp.test.local"
    port: 465
    username: "noreply@test.local"
    sender: "Test <noreply@test.local>"
    tls: true

zones:
  z1:
    description: "Test zone 1"
    ipPrefix: "10.10"
    gateway:
      wan:
        interface: "eth0"
      lan:
        interfaces: ["eth1"]
      vpn:
        ipv4: "100.64.0.1"

users:
  darkone:
    uid: 1000
    name: "Darkone"
    email: "darkone@test.local"
    profile: "nix-admin"
    groups: ["global"]

hosts:
  - hostname: "gw1"
    name: "Test gateway"
    zone: "z1:1.1"
    profile: "gateway"

  - hostname: "hv1"
    name: "Test hypervisor"
    zone: "z1:1.2"
    profile: "server"

  - hostname: "space1"
    name: "Test AI space"
    zone: "z1:1.40"
    profile: "ai-space"
    features: ["microvm-guest:hv1"]
    users: ["darkone"]
